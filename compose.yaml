# 로컬 개발용 MySQL 8.4 LTS. 단일 인스턴스의 DB 분리는 개발 편의이며 운영 격리 증거가 아니다
# (docs/baseline/architecture/00-architecture-overview.md). 테스트는 이 파일이 아니라 Testcontainers를 사용한다.
# 비밀번호는 .env(저장소 제외)로 주입한다. 예시: .env.example
services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${PAYCORE_MYSQL_ROOT_PASSWORD:?set in .env}
      PAYCORE_MASTER_DB_PASSWORD: ${PAYCORE_MASTER_DB_PASSWORD:?set in .env}
      # migration 계정(Flyway 전용, 자기 DB ALL, GRANT OPTION 없음). runtime 계정(위)은 runtime role의 표 단위 권한만 갖는다
      # (권한 migration이 초기화 스크립트의 procedure로 부여). docker/mysql/init/01-owned-databases.sh, 기존 volume 처리는 .env.example
      PAYCORE_MASTER_DB_MIGRATION_PASSWORD: ${PAYCORE_MASTER_DB_MIGRATION_PASSWORD:?set in .env}
      PAYCORE_PAYMENT_DB_PASSWORD: ${PAYCORE_PAYMENT_DB_PASSWORD:?set in .env}
      PAYCORE_PAYMENT_DB_MIGRATION_PASSWORD: ${PAYCORE_PAYMENT_DB_MIGRATION_PASSWORD:?set in .env}
      PAYCORE_FINANCIAL_DB_PASSWORD: ${PAYCORE_FINANCIAL_DB_PASSWORD:?set in .env}
      # FINANCIAL migration 계정(FIN-DBACCOUNT-001, D-FFR-002 — Flyway 전용, paycore_financial ALL, GRANT OPTION 없음). runtime 계정(위)은 role의 표·열 단위 권한만.
      # 없으면 compose가 기동을 거부한다(fail-closed). 기존 volume·.env는 .env.example의 FINANCIAL 절차로 수렴시킨다.
      PAYCORE_FINANCIAL_DB_MIGRATION_PASSWORD: ${PAYCORE_FINANCIAL_DB_MIGRATION_PASSWORD:?set in .env}
      # ADMIN DB(internal-admin 소유 — ADMIN-BOOT-001 §4.2.1, D-ADMIN-005). runtime 계정은 role의 표·열 단위 권한만, migration 계정은 Flyway 전용.
      # 없으면 compose가 기동을 거부한다(fail-closed). 기존 volume·.env는 .env.example의 ADMIN 절차로 수렴시킨다.
      PAYCORE_ADMIN_DB_PASSWORD: ${PAYCORE_ADMIN_DB_PASSWORD:?set in .env}
      PAYCORE_ADMIN_DB_MIGRATION_PASSWORD: ${PAYCORE_ADMIN_DB_MIGRATION_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - paycore-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 가상 인증기관·가상 VAN Simulator 전용 MySQL(AUTHN-001 §13.1, AUTH-001 §5.5). PayCore DB 인스턴스와 분리 — 외부 기관 대역의 사실은 PG 재시작·rollback과 무관하게 남는다.
  # runtime 계정은 표 단위 권한만(AUTH-001 AU-20 — 가상 VAN 원장 SELECT·INSERT). 기존 볼륨은 초기화 스크립트를 한 번 다시 실행해 수렴시킨다(.env.example).
  # 같은 이미지(mysql:8.4.11)라 IMAGE-DIGESTS 변경 없음. 계정: docker/simulator-mysql/init/01-simulator-database.sh
  # profile "simulator"로만 기동한다(`docker compose --profile simulator up -d`) — 기존 .env에 아래 변수가 없어도 기본 `docker compose …`가 깨지지 않게
  # `${VAR:-}`로 둔다(검토 m-3). 값이 비면 MySQL 이미지·초기화 스크립트(01-simulator-database.sh)가 기동을 거부한다. 시험(Testcontainers)은 compose를 쓰지 않는다.
  simulator-mysql:
    image: mysql:8.4.11
    profiles: ["simulator"]
    environment:
      MYSQL_ROOT_PASSWORD: ${PAYCORE_SIMULATOR_MYSQL_ROOT_PASSWORD:-}
      PAYCORE_SIMULATOR_DB_PASSWORD: ${PAYCORE_SIMULATOR_DB_PASSWORD:-}
      PAYCORE_SIMULATOR_DB_MIGRATION_PASSWORD: ${PAYCORE_SIMULATOR_DB_MIGRATION_PASSWORD:-}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./docker/simulator-mysql/init:/docker-entrypoint-initdb.d:ro
      - paycore-simulator-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  paycore-mysql-data:
  paycore-simulator-mysql-data:
