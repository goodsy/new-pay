# 시험 전용 설정(test classpath에만 있다 — 운영 jar에 들어가지 않는다). Spring Boot는 classpath:/config/application.yml을 운영 application.yml 위에 덧씌운다.
# 운영 application.yml에는 아래 값의 기본값이 없다(없으면 기동 실패 — FIN-FACT-RELAY-001 §8).
# 서명 키는 golden(payment-fact-relay-v1.golden.json)의 시험 전용 키 두 개다(운영 키 아님 — 교체 중 2키 시험). 시각 창·본문 상한은 Demo 값(운영값 LIVE Gate).
server:
  # 0 = 시험마다 임의 포트(RANDOM_PORT 시험은 실제 포트를 주입받는다). 바인딩은 loopback.
  port: 0
  address: 127.0.0.1
paycore:
  financial:
    payment-fact-inbox:
      clock-window: PT300S
      max-body-bytes: 65536
      signing-keys:
        - key-id: fact-golden-k1
          secret: dGVzdC1vbmx5LXBheW1lbnQtZmFjdC1nb2xkZW4ta2V5LTAwMDE=
        - key-id: fact-golden-k2
          secret: dGVzdC1vbmx5LXBheW1lbnQtZmFjdC1nb2xkZW4ta2V5LTAwMDI=
    # ACQUIRING-001 매입 설정(Demo 값 — 운영값 아님, D-ACQ-003). 마감 정책은 버전 관리 설정이다. 시험은 업무일을 과거로 두고 시계를 고정한다.
    acquiring:
      sender-id: PAYCORE
      cutoff-policies:
        - version: acq-cutoff-demo-1
          effective-from: "2026-01-01"
          cutoff-time: "23:00"
      # ACQUIRING-001 2-F 결과 마감(Demo 값 — 운영값 LIVE Gate). 시험은 대개 서비스를 고정 시계·명시 마감으로 직접 만들고, 이 값은 운영 Bean(스케줄러 시험)만 쓴다.
      results:
        deadline: PT1H
