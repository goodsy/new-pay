spring:
  application:
    name: financial-batch
  # FIN-FACT-RELAY-001: PAYMENT 결제 사실 내부 Inbox를 받으므로 servlet 웹 앱이다(공개 API 없음 — 진입 필터가 Inbox 경로·health 밖을 404로 막는다).
  main:
    web-application-type: servlet
  # FINANCIAL DB 접속 정보는 환경변수로만 주입한다. 기본값/비밀번호를 저장소에 두지 않는다.
  # runtime 계정(FIN-DBACCOUNT-001, D-FFR-002): DB 단위 권한 없이 role(paycore_financial_runtime)의 표·열 단위 권한만 가진다 — DDL 불가, append-only 사실 표
  # (Inbox·승인·취소·보류)는 SELECT·INSERT만, 결제별 직렬화 행·Batch metadata는 필요한 열만 UPDATE, DELETE는 어디에도 없다.
  # 계정·role·권한 부여 procedure: docker/mysql/init/01-owned-databases.sh, 표별 권한: db/runtime-privilege/financial.
  datasource:
    url: ${PAYCORE_FINANCIAL_DB_URL}
    username: ${PAYCORE_FINANCIAL_DB_USERNAME}
    password: ${PAYCORE_FINANCIAL_DB_PASSWORD}
    hikari:
      # 모든 JDBC 경로에서 DATETIME(3) ↔ Instant를 UTC로 변환하고 세션 time_zone도 UTC로 맞춘다(payment-api와 같다 — CP-DB-001 M-2).
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    # API에는 DTO만 전달한다. 요청 전체에 영속성 컨텍스트를 열어 두지 않는다.
    open-in-view: false
    hibernate:
      # schema 기준은 Flyway migration. Hibernate가 DDL을 만들지 않고 일치 여부만 검사한다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # schema 기준은 Flyway migration이다. V1 = Spring Batch metadata(BATCH_*, D-ACQ-007 — FINANCIAL DB 같은 schema), V2 = 결제 사실 Inbox·투영(FIN-FACT-RELAY-001).
    # runtime 표·열 단위 권한(db/runtime-privilege/financial — V3, FIN-DBACCOUNT-001)은 업무 schema와 다른 위치에 둔다(payment-api·master-api와 같은 관례).
    locations: classpath:db/migration/financial,classpath:db/runtime-privilege/financial
    # migration 계정(FINANCIAL DB ALL, GRANT OPTION 없음). Flyway만 이 계정으로 별도 연결을 만든다(URL은 datasource와 같다). payment-api와 같은 변수 이름 규칙.
    user: ${PAYCORE_FINANCIAL_DB_MIGRATION_USERNAME}
    password: ${PAYCORE_FINANCIAL_DB_MIGRATION_PASSWORD}
    # 별도 연결에는 위 hikari driver 속성이 적용되지 않는다. migration 세션도 UTC로 맞춘다.
    init-sqls: "SET time_zone = '+00:00'"
  batch:
    jdbc:
      # Boot가 schema-mysql.sql을 직접 실행하지 않는다. Flyway만 schema를 만든다.
      initialize-schema: never
    job:
      # 기동 시 Job 자동 실행 금지. 실행은 명시적 JobParameters와 함께 운영 절차로만 한다.
      enabled: false

# 내부 HTTP(결제 사실 Inbox). 운영 기본값 없음 — 포트·바인딩 주소를 배포 환경이 주지 않으면 기동하지 않는다. 바인딩은 내부망 주소만(공개 노출 금지, mTLS는 LIVE Gate).
server:
  port: ${PAYCORE_FINANCIAL_INBOX_PORT}
  address: ${PAYCORE_FINANCIAL_INBOX_ADDRESS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    # ACQUIRING-001 2-D 리뷰 m-2: SSHD 내부 로그(접속·KEX 상세)는 WARN 이상만. 키·지문 원문은 PayCore 로그에도 남기지 않는다.
    org.apache.sshd: WARN
    # MySQL 1062 등 JDBC 오류 원문에는 키 값이 들어 있다. 구조화 로그(분류·vendor code)를 남기므로 원문 로그는 끈다(payment-api와 같다).
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

# 결제 사실 Inbox 수신(FIN-FACT-RELAY-001 §4.1·§8). 운영 기본값 없음 — 값이 없거나 범위 밖이면 기동 실패.
#   paycore.financial.payment-fact-inbox.signing-keys[].{key-id([A-Za-z0-9._-]{1,32}),secret(Base64 ≥ 32바이트, 환경변수)} — 1..2개(교체 중에만 2개). 이 채널 전용 키 공간.
#   paycore.financial.payment-fact-inbox.clock-window: 서명 시각 창(1s..10m, 정수 초, Demo PT300S — 운영값 LIVE Gate)
#   paycore.financial.payment-fact-inbox.max-body-bytes: 본문 상한(1 KiB..1 MiB, Demo 65536)
#   로컬 Demo 예시: .env.example PAYCORE_FINANCIAL_INBOX_JSON

# 매입(ACQUIRING-001 — 배치1: 보류 해제 일괄 처리 + 봉인, 전송은 배치2). 운영 기본값 없음 — 값이 없거나 형식 밖이면 기동 실패.
#   paycore.financial.acquiring.sender-id: 파일 헤더 송신자 ID([A-Z0-9]{1,16}, Demo — 실제 등록 ID는 LIVE Gate)
#   paycore.financial.acquiring.cutoff-policies[].{version([A-Za-z0-9._-]{1,64}), effective-from(yyyy-MM-dd), cutoff-time(HH:mm, Asia/Seoul)}
#     — 버전 관리되는 마감 정책(D-ACQ-003 — Demo 값, 운영값 아님). 업무일 = Asia/Seoul 달력일(Q-CALENDAR 전 Demo 한정).
#   로컬 Demo 예시: .env.example PAYCORE_FINANCIAL_INBOX_JSON(같은 SPRING_APPLICATION_JSON에 함께 둔다)

# 매입 SFTP 전송(ACQUIRING-001 배치2 2-D — D-ACQ-006 클라이언트 키 인증 + host key 고정). 운영 기본값 없음: 매입사 항목이 없으면 그 매입사로 전송하지 않는다
# (NOT_CONFIGURED — fail-closed), 항목이 있으면 모든 값이 필수이고 형식 밖이면 기동 실패. 키는 파일 경로로만(키 원문 설정 없음, 소유자만 읽기). Demo 값.
#   paycore.financial.acquiring.transport.lease: 전송 점유 시간(AcquiringTransportSettings.minimumLease — 접속 2회·요청 6회·rename 여유·시계 차이보다 길게)
#   paycore.financial.acquiring.transport.clock-skew-allowance: 인스턴스 사이 시계 차이 허용치(0..PT1M, rename 안전 여유 = io-timeout + 이 값)
#   paycore.financial.acquiring.transport.acquirers.<CODE>.{host, port, username, private-key-path, host-key-fingerprints[](SHA256:… 1..2개),
#     inbox-dir, outbox-dir, connect-timeout, io-timeout}
#
# 매입 결과 수신·마감·스케줄(ACQUIRING-001 배치2 2-F). 운영 기본값 없음(fail-closed):
#   paycore.financial.acquiring.results.deadline: 전송 완료 뒤 결과 마감(PT1M..P30D, Demo 값 — 운영값 LIVE Gate). 없으면 결과 마감(UNKNOWN 기록)을 하지 않는다.
#   paycore.financial.acquiring.schedule.enabled: true일 때만 주기 실행(봉인 Job → 전송 → 결과 수신 → 결과 마감 → 지표). 기본 false — 스케줄러 Bean 자체가 없다.
#     켜면 모두 필수: fixed-delay(PT1S..P1D), lanes[].{acquirer-code, environment(TEST만 — D-ACQ-008), first-business-date}, batch-size(1..100),
#     max-seals-per-cycle(1..31). 다중 인스턴스는 분산 잠금 없이 DB 장치(lane 잠금·lease·@Version·파일 행 잠금·UNIQUE)로 안전하다.
#   재매입(2-G): 실행 경로 없음(ACQ-ADMIN-001 전 — D-ACQ-011). 설정 없음.
