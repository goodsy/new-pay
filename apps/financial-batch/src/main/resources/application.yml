spring:
  application:
    name: financial-batch
  # FIN-FACT-RELAY-001: PAYMENT 결제 사실 내부 Inbox를 받으므로 servlet 웹 앱이다(공개 API 없음 — 진입 필터가 Inbox 경로·health 밖을 404로 막는다).
  main:
    web-application-type: servlet
  # FINANCIAL DB 접속 정보는 환경변수로만 주입한다. 기본값/비밀번호를 저장소에 두지 않는다.
  # FINANCIAL은 아직 단일 계정(DB ALL — migration·runtime 같음)이다. MASTER·PAYMENT 같은 계정 분리·표 단위 runtime 권한은 후속(명세 §9 L-1, init 스크립트 변경 필요).
  datasource:
    url: ${PAYCORE_FINANCIAL_DB_URL}
    username: ${PAYCORE_FINANCIAL_DB_USERNAME}
    password: ${PAYCORE_FINANCIAL_DB_PASSWORD}
    hikari:
      # 모든 JDBC 경로에서 DATETIME(3) ↔ Instant를 UTC로 변환하고 세션 time_zone도 UTC로 맞춘다(payment-api와 같다 — CP-DB-001 M-2).
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    # API에는 DTO만 전달한다. 요청 전체에 영속성 컨텍스트를 열어 두지 않는다.
    open-in-view: false
    hibernate:
      # schema 기준은 Flyway migration. Hibernate가 DDL을 만들지 않고 일치 여부만 검사한다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # schema 기준은 Flyway migration이다. V1 = Spring Batch metadata(BATCH_*, D-ACQ-007 — FINANCIAL DB 같은 schema), V2 = 결제 사실 Inbox·투영(FIN-FACT-RELAY-001).
    locations: classpath:db/migration/financial
    init-sqls: "SET time_zone = '+00:00'"
  batch:
    jdbc:
      # Boot가 schema-mysql.sql을 직접 실행하지 않는다. Flyway만 schema를 만든다.
      initialize-schema: never
    job:
      # 기동 시 Job 자동 실행 금지. 실행은 명시적 JobParameters와 함께 운영 절차로만 한다.
      enabled: false

# 내부 HTTP(결제 사실 Inbox). 운영 기본값 없음 — 포트·바인딩 주소를 배포 환경이 주지 않으면 기동하지 않는다. 바인딩은 내부망 주소만(공개 노출 금지, mTLS는 LIVE Gate).
server:
  port: ${PAYCORE_FINANCIAL_INBOX_PORT}
  address: ${PAYCORE_FINANCIAL_INBOX_ADDRESS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    # MySQL 1062 등 JDBC 오류 원문에는 키 값이 들어 있다. 구조화 로그(분류·vendor code)를 남기므로 원문 로그는 끈다(payment-api와 같다).
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

# 결제 사실 Inbox 수신(FIN-FACT-RELAY-001 §4.1·§8). 운영 기본값 없음 — 값이 없거나 범위 밖이면 기동 실패.
#   paycore.financial.payment-fact-inbox.signing-keys[].{key-id([A-Za-z0-9._-]{1,32}),secret(Base64 ≥ 32바이트, 환경변수)} — 1..2개(교체 중에만 2개). 이 채널 전용 키 공간.
#   paycore.financial.payment-fact-inbox.clock-window: 서명 시각 창(1s..10m, 정수 초, Demo PT300S — 운영값 LIVE Gate)
#   paycore.financial.payment-fact-inbox.max-body-bytes: 본문 상한(1 KiB..1 MiB, Demo 65536)
#   로컬 Demo 예시: .env.example PAYCORE_FINANCIAL_INBOX_JSON
