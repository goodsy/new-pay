spring:
  application:
    name: financial-batch
  main:
    web-application-type: none
  # FINANCIAL DB 접속 정보는 환경변수로만 주입한다. 기본값/비밀번호를 저장소에 두지 않는다.
  datasource:
    url: ${PAYCORE_FINANCIAL_DB_URL}
    username: ${PAYCORE_FINANCIAL_DB_USERNAME}
    password: ${PAYCORE_FINANCIAL_DB_PASSWORD}
  flyway:
    # schema 기준은 Flyway migration이다. Batch metadata(BATCH_*) 위치는 Q-BATCH-META 답변 전이라 아직 여기 없다.
    # (시험용 PROVISIONAL 사본: src/test/resources/db/testmigration/financial/V0_1__spring_batch_metadata.sql)
    # 따라서 현재 운영 설정으로는 Job을 실행할 수 없다(실제 Job도 없음). MainMigrationLocationSpec이 이 상태를 고정한다.
    locations: classpath:db/migration/financial
  batch:
    jdbc:
      # Boot가 schema-mysql.sql을 직접 실행하지 않는다. Flyway만 schema를 만든다.
      initialize-schema: never
    job:
      # 기동 시 Job 자동 실행 금지. 실행은 명시적 JobParameters와 함께 운영 절차로만 한다.
      enabled: false
