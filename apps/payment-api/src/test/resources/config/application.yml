# 시험 전용 설정(test classpath에만 있다 — 운영 jar에 들어가지 않는다). Spring Boot는 classpath:/config/application.yml을 운영
# application.yml 위에 덧씌운다. 운영 application.yml에는 아래 값의 기본값이 없다(없으면 기동 실패 — MASTER-SNAPSHOT-001 명세 §8).
#
# clock-skew-margin은 **시험 fixture**다(운영값 아님 — 시계 오차 여유 운영 수치는 미확정, 허용 §4.2 마지막 문단).
# 서명 키는 시험 전용 값이다(운영 키 아님 — D-MS-004). 두 번째 키는 교체 기간 동시 허용(2키) 시험용이다.
paycore:
  payment:
    # CP-API-001 시험 값(운영값 아님). internal-port 0 = 시험마다 임의 포트(실제 포트는 InternalConnector.localPort).
    api:
      internal-port: 0
      retry-after:
        eligibility-unavailable: PT2S
        temporarily-unavailable: PT1S
        request-in-progress: PT1S
    # AUTHN-001 결제창 connector(AN-15) — 0 = 시험마다 임의 포트(실제 포트는 CheckoutConnector.localPort).
    checkout:
      port: 0
    # AUTHN-001 결제 유효기간(D-AUTHN-005) — 시험 Demo 값(운영값 아님).
    checkout-validity:
      version: checkout-validity-demo-1
      duration: PT30M
    # AUTHN-001 결제창 만료 주기 작업(§7.5.4) — 시험에서는 끄고 Use Case를 직접 부른다(Demo 값, 운영값 아님).
    checkout-expiry:
      job:
        enabled: false
        fixed-delay: PT1M
        batch-size: 100
    entitlement:
      clock-skew-margin: PT0.1S
      inbox:
        signing-keys:
          - key-id: test-k1
            secret: dGVzdC1vbmx5LWVudGl0bGVtZW50LXNpZ25pbmcta2V5LTEh
          - key-id: test-k2
            secret: dGVzdC1vbmx5LWVudGl0bGVtZW50LXNpZ25pbmcta2V5LTIh
  # AUTHN-001 결제창(§5·§6·§12.1) — 시험 Demo 값(운영값 아님). origin은 설정에서만 만든다(m-9).
  checkout:
    public-base-url: https://checkout.example.test
    policy-version: checkout-demo-1
    token-ttl: PT10M
    session-ttl: PT20M
    authentication-ttl: PT10M
  # AUTHN-001 인증 backend(§13.6) — 시험 Demo 값(운영값 아님). 서버 간 URL은 사용하지 않는 loopback 자리값이다(adapter 시험은 자체 stub 서버를 쓴다).
  # client 키는 시험 전용 값이다(운영 키 아님).
  authentication:
    backends:
      TEST:
        type: SIMULATOR
        profile: sim-auth-demo
    profiles:
      sim-auth-demo:
        version: sim-auth-demo-1
        card-companies:
          - code: SIMISS-A
            name: 가상카드A
          - code: SIMISS-B
            name: 가상카드B
        plan-policy:
          version: plan-demo-1
          currency: KRW
          installment-months: [2, 3, 6]
          minimum-installment-amount: 50000
    simulator:
      base-url: http://127.0.0.1:1
      # loopback http 서버 간 URL은 이 시험·로컬 표식이 있을 때만 허용(검토 #2 n-4 — 운영 설정에 두지 않는다).
      allow-loopback-http: true
      customer-base-url: https://sim.example.test
      client-key: test-only-simulator-client-key-1
      connect-timeout: PT0.5S
      read-timeout: PT1S
  # AUTH-001 가상 VAN Route 등록부(§5.8) — 시험 Demo 값(운영값 아님). host·port는 사용하지 않는 loopback 자리값이다(Adapter 시험은 자체 stub VAN을 쓴다).
  # HMAC 키는 golden(van-contract-sim-van-1)의 시험 전용 키다(운영 키 아님). 할부 개월은 위 결제창 Plan Demo 정책과 같은 값(AU-31).
  # CANCEL-001 취소 전송·회복 시간 설정(CN-29 — 시험 Demo 값, 운영값 아님). 회복 Worker 주기 실행은 끄고 시험이 직접 부른다.
  cancellation:
    timing:
      dispatch:
        lease: PT30S
        safety-margin: PT5S
        prepared-deadline: PT1S
        gate-retry-interval: PT0.2S
      recovery:
        enabled: false
        fixed-delay: PT5S
        batch-size: 50
        inquiry-interval: PT10S
        inquiry-budget: 3
        max-age: PT1H
        slow-inquiry-interval: PT10M
        version: cancel-recovery-demo-1
  authorization:
    # AUTH-001 승인 시간 설정(§4.4·§4.5·§6) — 시험 Demo 값(운영값 아님). 회복 Worker 주기 실행은 끄고 시험이 직접 부른다.
    timing:
      dispatch:
        lease: PT30S
        safety-margin: PT5S
        prepared-deadline: PT1S
        gate-retry-interval: PT0.2S
      recovery:
        enabled: false
        fixed-delay: PT5S
        batch-size: 50
        inquiry-interval: PT10S
        inquiry-budget: 3
        max-age: PT1H
        slow-inquiry-interval: PT10M
        version: recovery-demo-1
    backends:
      TEST:
        type: SIMULATOR
    routes:
      SIM-VAN-01:
        environment: TEST
        institution: SIMVAN
        protocol-version: sim-van-1
        profile-version: sim-van-a-demo-1
        host: 127.0.0.1
        port: 1
        key-id: sim-van-test-1
        key-base64: dGVzdC1vbmx5LXNpbS12YW4taG1hYy1rZXktMDAwMDE=
        connect-timeout: PT0.5S
        read-timeout: PT1S
        total-deadline: PT2S
        connect-retry-budget: 2
        capabilities:
          confirms-no-effect: true
          closable-after: PT2M
          inquiry-retention: P7D
          same-id-resend-safe: true
          authentication-evidence-reusable-for-resend: true
          supported-currencies: [KRW]
          supported-card-types: [CREDIT, CHECK]
          installment-card-types: [CREDIT]
          installment-months: [2, 3, 6]
          installment-minimum-amount: 50000
      # 프로파일 B(AUTH-001 §5.4 — 무효과 확정 Capability 없음: closeIfAbsent를 보내지 않고 NOT_FOUND는 예산 소진 시 대사 이관). 포트는 시험 stub(ProgrammableVanTestConfig).
      SIM-VAN-B:
        environment: TEST
        institution: SIMVAN
        protocol-version: sim-van-1
        profile-version: sim-van-b-demo-1
        host: 127.0.0.1
        port: 1
        key-id: sim-van-test-1
        key-base64: dGVzdC1vbmx5LXNpbS12YW4taG1hYy1rZXktMDAwMDE=
        connect-timeout: PT0.5S
        read-timeout: PT1S
        total-deadline: PT2S
        connect-retry-budget: 2
        capabilities:
          confirms-no-effect: false
          closable-after: PT2M
          inquiry-retention: P7D
          same-id-resend-safe: true
          authentication-evidence-reusable-for-resend: true
          supported-currencies: [KRW]
          supported-card-types: [CREDIT, CHECK]
          installment-card-types: [CREDIT]
          installment-months: [2, 3, 6]
          installment-minimum-amount: 50000
      # CANCEL-001 S5: sim-van-2 Route(취소 Capability 블록 — CN-28, Demo). 승인 Route(SIM-VAN-01·B)는 sim-van-1 그대로(기존 승인 시험 기대값 불변) — 취소 시험은
      # 이 Route로 승인한 Payment를 쓴다(Admission 대역이 MID별로 routeRef를 고른다). 포트는 시험 stub(ProgrammableVanTestConfig).
      SIM-VAN-C:
        environment: TEST
        institution: SIMVAN
        protocol-version: sim-van-2
        profile-version: sim-van-c-demo-1
        host: 127.0.0.1
        port: 1
        key-id: sim-van-test-1
        key-base64: dGVzdC1vbmx5LXNpbS12YW4taG1hYy1rZXktMDAwMDE=
        connect-timeout: PT0.5S
        read-timeout: PT1S
        total-deadline: PT2S
        connect-retry-budget: 2
        capabilities:
          confirms-no-effect: true
          closable-after: PT2M
          inquiry-retention: P7D
          same-id-resend-safe: true
          authentication-evidence-reusable-for-resend: true
          supported-currencies: [KRW]
          supported-card-types: [CREDIT, CHECK]
          installment-card-types: [CREDIT]
          installment-months: [2, 3, 6]
          installment-minimum-amount: 50000
          cancel:
            version: cancel-c-demo-1
            partial-lump-sum-card-types: [CREDIT, CHECK]
            partial-installment-card-types: [CREDIT]
            confirms-no-effect: true
            closable-after: PT2M
            inquiry-retention: P7D
      # 부분취소 신용 일시불만·취소 무효과 확정 없음(프로파일 B 모양 — PARTIAL_CANCEL_NOT_SUPPORTED·조회 이관 시험).
      SIM-VAN-CB:
        environment: TEST
        institution: SIMVAN
        protocol-version: sim-van-2
        profile-version: sim-van-cb-demo-1
        host: 127.0.0.1
        port: 1
        key-id: sim-van-test-1
        key-base64: dGVzdC1vbmx5LXNpbS12YW4taG1hYy1rZXktMDAwMDE=
        connect-timeout: PT0.5S
        read-timeout: PT1S
        total-deadline: PT2S
        connect-retry-budget: 2
        capabilities:
          confirms-no-effect: true
          closable-after: PT2M
          inquiry-retention: P7D
          same-id-resend-safe: true
          authentication-evidence-reusable-for-resend: true
          supported-currencies: [KRW]
          supported-card-types: [CREDIT, CHECK]
          installment-card-types: [CREDIT]
          installment-months: [2, 3, 6]
          installment-minimum-amount: 50000
          cancel:
            version: cancel-cb-demo-1
            partial-lump-sum-card-types: [CREDIT]
            partial-installment-card-types: ""
            confirms-no-effect: false
            closable-after: PT2M
            inquiry-retention: P7D
      SIM-VAN-CLOSED:
        environment: TEST
        institution: SIMVAN
        protocol-version: sim-van-1
        profile-version: sim-van-a-demo-1
        host: 127.0.0.1
        # 연결 거부 Route(connect 단계 실패 → NotSentConfirmed 시험 — 열리지 않는 loopback 포트 1)
        port: 1
        key-id: sim-van-test-1
        key-base64: dGVzdC1vbmx5LXNpbS12YW4taG1hYy1rZXktMDAwMDE=
        connect-timeout: PT0.5S
        read-timeout: PT1S
        total-deadline: PT2S
        connect-retry-budget: 2
        capabilities:
          confirms-no-effect: true
          closable-after: PT2M
          inquiry-retention: P7D
          same-id-resend-safe: true
          authentication-evidence-reusable-for-resend: true
          supported-currencies: [KRW]
          supported-card-types: [CREDIT, CHECK]
          installment-card-types: [CREDIT]
          installment-months: [2, 3, 6]
          installment-minimum-amount: 50000
