<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PayCore 결제</title>
    <link rel="stylesheet" th:href="@{/checkout/assets/checkout.css}">
</head>
<body>
<main class="checkout">
    <!-- 고정 문구만(AUTHN-001 §6.3·§12.5) — 예외·내부 사유·URL 원문을 넣지 않는다. 링크는 서버가 만든 값(다시 시도 경로, 저장된 검증 failUrl + paymentId·code — §8.3). -->
    <p class="message" th:text="${message}">결제창을 열 수 없습니다.</p>
    <p th:if="${retryUrl != null}"><a th:href="${retryUrl}">다시 시도</a></p>
    <p th:if="${failRedirect != null}"><a th:href="${failRedirect}">가맹점으로 돌아가기</a></p>
</main>
</body>
</html>
