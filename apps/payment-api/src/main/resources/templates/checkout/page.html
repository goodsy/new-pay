<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PayCore 결제</title>
    <link rel="stylesheet" th:href="@{/checkout/assets/checkout.css}">
</head>
<body>
<main class="checkout">
    <h1>결제</h1>
    <!-- 표시 값은 모두 th:text(escape) — 가맹점 입력(주문명)도 그대로 escape된다(AUTHN-001 §12.5). JS 없음. -->
    <p class="notice" th:if="${notice != null}" th:text="${notice}">안내</p>
    <dl class="summary">
        <dt>주문명</dt>
        <dd th:text="${view.orderName}">주문명</dd>
        <dt>결제 금액</dt>
        <dd><span th:text="${view.amountDisplay}">0</span> <span th:text="${view.currency}">KRW</span></dd>
        <dt>가맹점</dt>
        <dd th:text="${view.siteHost}">shop.example.test</dd>
    </dl>
    <form method="post" th:action="${authenticationAction}">
        <fieldset>
            <legend>카드사</legend>
            <label th:each="company, it : ${view.cardCompanies}">
                <input type="radio" name="cardCompany" th:value="${company.value}" th:checked="${it.first}">
                <span th:text="${company.label}">카드사</span>
            </label>
        </fieldset>
        <fieldset>
            <legend>할부</legend>
            <label th:each="plan, it : ${view.plans}">
                <input type="radio" name="plan" th:value="${plan.value}" th:checked="${it.first}">
                <span th:text="${plan.label}">일시불</span>
            </label>
        </fieldset>
        <button type="submit">카드 인증</button>
    </form>
    <form method="post" th:action="${cancelAction}">
        <button type="submit" class="secondary">결제 취소</button>
    </form>
</main>
</body>
</html>
