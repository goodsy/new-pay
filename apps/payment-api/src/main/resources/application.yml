spring:
  application:
    name: payment-api
  # PAYMENT DB 접속 정보는 환경변수로만 주입한다. 기본값/비밀번호를 저장소에 두지 않는다.
  datasource:
    url: ${PAYCORE_PAYMENT_DB_URL}
    username: ${PAYCORE_PAYMENT_DB_USERNAME}
    password: ${PAYCORE_PAYMENT_DB_PASSWORD}
  jpa:
    # 화면/API에는 DTO만 전달한다. 요청 전체에 영속성 컨텍스트를 열어 두지 않는다.
    open-in-view: false
    hibernate:
      # schema 기준은 Flyway migration. Hibernate가 DDL을 만들지 않고 일치 여부만 검사한다.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/payment
  jooq:
    sql-dialect: MYSQL

management:
  endpoints:
    web:
      exposure:
        include: health
