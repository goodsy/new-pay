spring:
  application:
    name: payment-api
  # PAYMENT DB 접속 정보는 환경변수로만 주입한다. 기본값/비밀번호를 저장소에 두지 않는다.
  datasource:
    # runtime 계정: DB 단위 권한 없이 role(paycore_payment_runtime)의 표 단위 권한만 가진다(DDL 불가, append-only 표는 SELECT·INSERT만).
    # 계정·role·권한 부여 procedure: docker/mysql/init/01-owned-databases.sh, 표별 권한: db/runtime-privilege/payment (PAYMENT-DBACCOUNT-001)
    url: ${PAYCORE_PAYMENT_DB_URL}
    username: ${PAYCORE_PAYMENT_DB_USERNAME}
    password: ${PAYCORE_PAYMENT_DB_PASSWORD}
    hikari:
      # 모든 JDBC 경로(JPA 밖의 jOOQ·raw SQL 포함)에서 DATETIME(3) ↔ Instant를 UTC로 변환하고 세션 time_zone도 UTC로 맞춘다.
      # 기본값(connectionTimeZone=LOCAL)은 JVM 기본 시간대로 변환해 비UTC JVM에서 9시간 등 어긋난다(UtcStorageSpec, CP-DB-001 M-2).
      # URL이 아니라 driver 속성으로 둬서 ServiceConnection(시험)·환경변수 URL(운영) 어느 쪽이든 같이 적용된다.
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    # 화면/API에는 DTO만 전달한다. 요청 전체에 영속성 컨텍스트를 열어 두지 않는다.
    open-in-view: false
    hibernate:
      # schema 기준은 Flyway migration. Hibernate가 DDL을 만들지 않고 일치 여부만 검사한다.
      ddl-auto: validate
    properties:
      # 시각 컬럼(DATETIME(3))은 UTC로 읽고 쓴다(JVM 기본 시간대와 무관하게 Instant가 같은 값으로 왕복). CP-DB-001.
      hibernate.jdbc.time_zone: UTC
  flyway:
    # 업무 schema(db/migration/payment)와 runtime 표 단위 권한(db/runtime-privilege/payment). 권한 migration을 별도 위치에 두는 이유:
    # jOOQ 생성기는 업무 schema 위치만 적용하며 생성기 컨테이너에는 권한 부여 procedure가 없다(ARCHITECTURE-CONVENTIONS §9).
    locations: classpath:db/migration/payment,classpath:db/runtime-privilege/payment
    # migration 계정(PAYMENT DB ALL, GRANT OPTION 없음). Flyway만 이 계정으로 별도 연결을 만든다(URL은 datasource와 같다). master-api와 같은 변수 이름 규칙.
    user: ${PAYCORE_PAYMENT_DB_MIGRATION_USERNAME}
    password: ${PAYCORE_PAYMENT_DB_MIGRATION_PASSWORD}
    # 별도 연결에는 위 hikari driver 속성이 적용되지 않는다. migration 세션도 UTC로 맞춰 시각 기본값/변환이 앱과 같게 한다(D2).
    init-sqls: "SET time_zone = '+00:00'"
  jooq:
    sql-dialect: MYSQL

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 공개 포트에도 health가 있으므로 세부(DB 상태·세션 시간대 등)를 내보내지 않는다(CP-API-001 명세 §8).
      show-details: never

logging:
  level:
    # MySQL 1062 등 JDBC 오류 원문에는 키 값(멱등키·주문 ID·paymentKey)이 들어 있다. 구조화 로그(operation·correlationId·분류·vendor code)를
    # 남기므로 원문 로그는 끈다(MASTER-DOMAIN-001 review2 n-4 — master-api와 같다). Hibernate 7 범주와 이전 이름 모두.
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

# 가맹점 공개 API(CP-API-001). 운영 기본값 없음 — 배포 환경이 값을 주지 않으면 기동하지 않는다(명세 §7.4·§8).
#   paycore.payment.api.internal-port: 내부 경로(/internal/**) 전용 connector 포트(공개 포트와 달라야 한다)
#   paycore.payment.api.retry-after.{eligibility-unavailable,temporarily-unavailable,request-in-progress}: Retry-After 권고(1s..1h)
# 결제창(AUTHN-001 §5·§6·§12). 운영 기본값 없음 — 값이 없으면 기동 실패.
#   paycore.payment.checkout.port: 결제창 전용 connector 포트(공개·내부 포트와 달라야 한다), paycore.payment.checkout.address(선택)
#   paycore.checkout.{public-base-url(https origin),policy-version,token-ttl,session-ttl,authentication-ttl}
# 결제 유효기간(AUTHN-001, D-AUTHN-005). 운영 기본값 없음 — 값이 없거나 duration ≤ 0이면 기동 실패.
#   paycore.payment.checkout-validity.version: 설정 버전(Payment 행에 함께 저장, 1..64자)
#   paycore.payment.checkout-validity.duration: 생성 시각부터 결제창 절대 만료까지(ISO-8601 기간, 양수)
# 인증 backend(AUTHN-001 §13.6, D-AUTHN-004). 운영 기본값 없음 — 값이 없으면 기동 실패. 기동 검사: type은 SIMULATOR만, SIMULATOR는 TEST 환경만(LIVE·REAL 거부).
#   paycore.authentication.backends.<TEST|LIVE>.{type,profile}, paycore.authentication.profiles.<id>.{version,card-companies,plan-policy}
#   paycore.authentication.simulator.{base-url,customer-base-url,client-key(환경변수),connect-timeout,read-timeout}
#   paycore.authentication.simulator.allow-loopback-http: 로컬 Demo·시험 전용(기본 false) — 켜야만 서버 간 URL에 http://127.0.0.1·localhost 허용

