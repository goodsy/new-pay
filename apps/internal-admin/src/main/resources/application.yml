spring:
  application:
    name: internal-admin
  # ADMIN DB(paycore_admin, D-ADMIN-005) 접속 정보는 환경변수로만 주입한다. 기본값/비밀번호를 저장소에 두지 않는다. 다른 소유 DB 접속 정보는 두지 않는다.
  datasource:
    # runtime 계정: DB 단위 권한 없이 role(paycore_admin_runtime)의 표 단위 SELECT·INSERT + 열 단위 UPDATE만(DDL·DELETE 불가 — 세션 표만 전체 DML).
    # 계정·role·procedure: docker/mysql/init/01-owned-databases.sh, 표·열 권한: db/runtime-privilege/admin(ARCHITECTURE-CONVENTIONS §9.2).
    url: ${PAYCORE_ADMIN_DB_URL}
    username: ${PAYCORE_ADMIN_DB_USERNAME}
    password: ${PAYCORE_ADMIN_DB_PASSWORD}
    hikari:
      # 모든 JDBC 경로(JPA 밖의 jOOQ·raw SQL 포함)에서 DATETIME ↔ Instant를 UTC로 변환하고 세션 time_zone도 UTC로 맞춘다(master-api·payment-api 관례).
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    # 화면/API에는 DTO만 전달한다. 요청 전체에 영속성 컨텍스트를 열어 두지 않는다.
    open-in-view: false
    hibernate:
      # schema 기준은 Flyway migration. Hibernate는 DDL을 만들지 않고 일치 여부만 검사한다(runtime 계정은 DDL 권한도 없다).
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # 업무 schema(db/migration/admin)와 runtime 표·열 단위 권한(db/runtime-privilege/admin). 권한 위치를 분리하는 이유: jOOQ 생성기는 업무 schema만
    # 적용하며 생성기 컨테이너에는 권한 부여 procedure가 없다(§9.2).
    locations: classpath:db/migration/admin,classpath:db/runtime-privilege/admin
    # migration 계정(ADMIN DB ALL, GRANT OPTION 없음). Flyway만 이 계정으로 별도 연결을 만든다(URL은 datasource와 같다).
    user: ${PAYCORE_ADMIN_DB_MIGRATION_USERNAME}
    password: ${PAYCORE_ADMIN_DB_MIGRATION_PASSWORD}
    # 별도 연결에는 위 hikari driver 속성이 적용되지 않는다. migration 세션도 UTC로 맞춘다.
    init-sqls: "SET time_zone = '+00:00'"
  jooq:
    sql-dialect: MYSQL
  # D-ADMIN1-021(Q-S8-D): commit 단계 TransactionException이어도 관리자가 rollback을 시도한다(기본 false면 rollback 없이 연결을 돌려준다 — S8 실측).
  # internal-admin만(payment-api·master-api는 별도 판단). 결과는 여전히 "commit 결과 불명"(CommitOutcomeUnknownException → 500, 다시 읽어 수렴).
  transaction:
    rollback-on-commit-failure: true
  # 관리자 세션 = Spring Session JDBC(D-ADMIN-004 — Redis 없음). 표는 Flyway V3(initialize-schema never), 속성 표 소문자 이름·문자열 값 변환은
  # security.session.AdminSessionConfiguration. save-mode는 기본 ON_SET_ATTRIBUTE를 명시(§17.5 — ON_GET·ALWAYS 금지), 만료 정리는 1분마다.
  session:
    timeout: 10m
    jdbc:
      table-name: admin_session
      initialize-schema: never
      save-mode: on-set-attribute
      flush-mode: on-save
      cleanup-cron: "0 * * * * *"
  web:
    error:
      # 오류 응답에 Whitelabel HTML·stack·메시지·경로를 내지 않는다(§4.10, S1 리뷰 m4).
      # Boot 4.0부터 server.error.*는 폐기 키(level=error, 적용 안 됨) → spring.web.error.*(spring-boot-autoconfigure 4.1.1 메타데이터 확인).
      # 기본값: include-path=always(그래서 명시), include-message/stacktrace/binding-errors=never, include-exception=false, whitelabel=true.
      whitelabel:
        enabled: false
      include-path: never
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false

server:
  # 원격 주소는 remoteAddr만(프록시 헤더 불신 — §4.8.1). 세션 쿠키 속성은 AdminSessionConfiguration의 CookieSerializer가 고정한다(__Host-PCADMIN).
  forward-headers-strategy: none

management:
  server:
    # D-15(S8): actuator는 별도 management 포트에만. 포트 변수가 없으면 -1 = HTTP actuator 없음(노출 없는 쪽으로 실패 — 기동은 한다).
    # 기본 바인딩은 loopback(외부 수집기는 배치 환경이 주소를 명시). 그 포트의 보안 체인은 SecurityConfig.managementSecurityFilterChain(health만).
    port: ${PAYCORE_ADMIN_MANAGEMENT_PORT:-1}
    address: ${PAYCORE_ADMIN_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        # health만. 웹 포트에는 actuator가 없다(그 경로는 SecurityConfig 허용 목록 밖이라 익명 401·인증 403).
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    # 민감값 비노출(master-api와 같은 이유): MySQL 1062 원문에는 키 값(login_name 등)이 들어 있다. 저장 실패 분류는 adapter가 제약 이름으로 한다.
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

paycore:
  admin:
    # 배치 모드(§4.8.2 — 기본값 없음, DEMO|LIVE). LIVE는 Demo 키·Demo 보안 수치·BCrypt cost 하한 미달이면 기동 실패(LiveModeStartupGuard).
    deployment-mode: ${PAYCORE_ADMIN_DEPLOYMENT_MODE}
    # 2인 승인(D-SV Demo — 운영값 아님): 요청 유효 24시간, 만료 정리 job(화면용 — 권위 판정은 승인 TX) 1분마다.
    approval:
      validity: 24h
      # 근거·사유 권한 조회의 조회자별 분당 상한(D-OPS-010·I-131 — Demo 값, 운영값 아님): 거부 감사 대량 생성 억제.
      justification-per-minute: 20
      expiry-job:
        enabled: true
        fixed-delay: 1m
    # PAYMENT 운영 호출(ADMIN-PAYMENT-OPS-001 §4.2·§4.7·§4.16 — **Demo 값, 운영값 아님**, I-24 LIVE Gate). 연결·키는 환경변수로만(저장소에 키 없음, LIVE에서 Demo 키면 기동 실패).
    # 기동 검사: stale(connect + read + 30s) < backoff-max < execution-window ≤ payment-max-execution-window(PAYMENT max-execution-window 거울 값), context path 금지.
    payment-ops:
      base-url: ${PAYCORE_ADMIN_PAYMENT_OPS_BASE_URL}
      key-id: ${PAYCORE_ADMIN_PAYMENT_OPS_KEY_ID}
      signing-key: ${PAYCORE_ADMIN_PAYMENT_OPS_SIGNING_KEY}
      connect-timeout: 2s
      read-timeout: 30s
      permits:
        approval: 4
        lookup: 4
        execution: 4
      lookup-per-minute: 30
      # ADMIN-HOME-KPI-001 C-4: 운영 홈 KPI actor별 분당 상한(필수 — 기본값 없음, 거래 조회 lookup-per-minute 창과 별개, 화면 polling 없음 — Demo 값, 운영값 아님).
      home-kpi-per-minute: 30
      execution-window: 24h
      # I-113: backoff-initial > connect + read(2s + 30s) — Demo 값(운영값 아님, LIVE Gate).
      backoff-initial: 40s
      backoff-max: 10m
      payment-max-execution-window: 24h
      # 회복 job(§4.16 — Demo): 기한 확인 시작 여유(I-34), 1회 선점 상한, 주기. 재전송 시도 상한 없음(D-OPS-003).
      deadline-skew: 5m
      recovery-batch-size: 50
      # 대사(§4.17 — Demo): PAYMENT 안정 지연 거울 값, 실행당 증분 페이지 상한, 전체 스캔 주기(watermark 불변 — 최종 안전망).
      decision-stable-delay: 2m
      reconciliation-max-pages: 10
      reconciliation-full-scan-interval: 1d
      reconciliation:
        enabled: true
        fixed-delay: 5m
      recovery:
        enabled: true
        fixed-delay: 30s
    # MASTER 조회 호출(MERCHANT-OPS-001 §4 — **Demo 값, 운영값 아님**, LIVE Gate). 연결·키는 환경변수로만(저장소에 키 없음). PAYMENT ops 키와 kid·바이트가 같으면,
    # LIVE에서 Demo·시험 키면, context path가 있으면 기동 실패. permit은 PAYMENT ops와 별개(MASTER 장애가 승인·결제 운영을 막지 않는다).
    master-ops:
      base-url: ${PAYCORE_ADMIN_MASTER_OPS_BASE_URL}
      key-id: ${PAYCORE_ADMIN_MASTER_OPS_KEY_ID}
      signing-key: ${PAYCORE_ADMIN_MASTER_OPS_SIGNING_KEY}
      connect-timeout: 2s
      read-timeout: 10s
      permits: 4
      # actor별 분당 상한(Demo): 목록·상세·이력 공용 30, 사업자등록번호 검색 10(oracle 방어 — 모든 시도 감사).
      lookup-per-minute: 30
      registration-number-searches-per-minute: 10
      # MERCHANT-OPS-002 §4(Demo 값, 운영값 아님 — LIVE Gate): 등록 명령 permit(조회 permit과 별개, 대기 0 — C-1), actor별 분당 등록 상한.
      # 사업자 등록은 위 registration-number-searches-per-minute 버킷에서도 1회를 예약한다(C-13 — 중복 결과는 검색과 같은 정보).
      write-permits: 2
      registrations-per-minute: 20
      # TXN-LIST-ENRICH-001 §3.6(Demo 값, 운영값 아님 — LIVE Gate, 기본값 없음): 거래 목록 라벨 조회 전용 permit(조회·승인 결정 조회 permit과 별개, 대기 0 — M-1)과
      # 라벨 전용 짧은 read timeout(read-timeout 이하 — M-2: MASTER 지연이 목록을 10s까지 붙잡지 않는다. 목록 지연 상한 = PAYMENT + connect + 이 값).
      label-permits: 2
      label-read-timeout: 2s
      # MERCHANT-CODE-001 §5.6.3 C-35(Demo 값, 운영값 아님 — LIVE Gate, 기본값 없음 1..600): 승인함·감사 화면 가맹점 라벨 API의 actor별 분당 창(HTTP 호출 1회당 1 소비 —
      # 가맹점 검색 창 lookup-per-minute과 별개, 라벨 permit·timeout은 위 두 값을 공유 C-34).
      label-reads-per-minute: 60
    # MERCHANT-OPS-002 B2-2 가맹점 2인 승인(C-19 — **Demo 값, 운영값 아님**, LIVE Gate, 기본값 없음): 실행 창(승인 + 이 값 = 실행 기한, MASTER max-execution-window PT24H 이하),
    # 기한 확인 여유(MASTER max-clock-skew PT1M + read timeout 이상), 회복 다음 시도 간격(두 배씩 — 상한 PT30M). stale = master-ops connect + read + 30초.
    merchant-ops:
      # BUSINESS-PROFILE-001 §7.1 m-2(Demo 값, 운영값 아님 — LIVE Gate L-14, 기본값 없음 1..10000): 사업자 조회 창 — actor별 분당, 목록·상세·이력·번호 조회 공용
      # (가맹점 조회 창 master-ops.lookup-per-minute·라벨 창과 별개).
      business-reads-per-minute: 30
      approval:
        execution-window: 1h
        deadline-grace: 2m
        backoff-initial: 30s
        backoff-max: 30m
        # B2-2 리뷰 n-1: MASTER paycore.master.admin-channel.approval.max-execution-window 거울 값(Demo PT24H — 운영값 아님). execution-window가 이보다 크면 기동 실패.
        master-max-execution-window: 24h
    # FINANCIAL 매입 현황 조회 호출(ACQ-VIEW-001 §4.6 — **Demo 값, 운영값 아님**, LIVE Gate). 연결·키는 환경변수로만(저장소에 키 없음). 키는 FINANCIAL
    # `paycore.financial.admin-channel` 키와 같은 값이고, PAYMENT·MASTER ops 키와 kid·바이트가 같으면, LIVE에서 Demo·시험 키면, context path가 있으면 기동 실패.
    # permit은 PAYMENT·MASTER ops와 별개(FINANCIAL 장애가 결제·가맹점 운영을 막지 않는다). 응답 읽기 상한 128 KiB(코드 상수).
    financial-ops:
      base-url: ${PAYCORE_ADMIN_FINANCIAL_OPS_BASE_URL}
      key-id: ${PAYCORE_ADMIN_FINANCIAL_OPS_KEY_ID}
      signing-key: ${PAYCORE_ADMIN_FINANCIAL_OPS_SIGNING_KEY}
      connect-timeout: 2s
      read-timeout: 10s
      permits: 4
      # actor별 분당 상한(Demo): 목록·상세·레코드 쪽 공용.
      lookup-per-minute: 30
      # ACQ-ADMIN-001 B1-A(D-ACQA-001 "조작 전용 키 따로"): 재매입 실행·결정 조회·기한 확인 서명 키(FINANCIAL admin-channel.operation-keys와 같은 값, 조회 키와 kid·바이트가
      # 달라야 기동). 실행 기한 폭은 FINANCIAL max-execution-window 이하(Demo PT24H — 운영값 LIVE Gate). 조작 permit은 조회 permit과 분리(대기 0).
      operation-key-id: ${PAYCORE_ADMIN_FINANCIAL_OPS_OPERATION_KEY_ID}
      operation-signing-key: ${PAYCORE_ADMIN_FINANCIAL_OPS_OPERATION_SIGNING_KEY}
      operation-permits: 2
      operation-execution-window: 24h
    # 활성 역할 보유자 gauge(D-ADMIN1-023 — `paycore.admin.accounts.active{role}`, 경보 기준 2 미만은 운영 설정). 주기 Demo 1분(운영값 LIVE Gate).
    # 1회성 명령 모드에서는 켜져 있어도 등록되지 않는다(ActiveRoleHolderGaugeScheduler 조건).
    accounts:
      active-role-gauge:
        enabled: true
        fixed-delay: 1m
    # 오프라인 복구(§4.9.2 — D-SV Demo, 운영값 아님): 회차 유효 24시간(작업 A·B 코드 만료 = 회차 만료).
    recovery:
      episode-validity: 24h
    network:
      # IP 허용 목록(§4.8.1 — 필수, 빈 목록 기동 실패). 쉼표로 구분한 IP 또는 CIDR. 저장소에 운영 값 없음.
      ip-allowlist: ${PAYCORE_ADMIN_IP_ALLOWLIST}
    # 계정 보안 수치(D-SV — **Demo 값, 운영값 아님**, Q-ADMIN-SEC-VALUES·LIVE Gate). 코드 기본값 없음: 키가 빠지면 기동 실패.
    security:
      login-max-failures: 5
      totp-window-steps: 1
      enrollment-code-validity: 24h
      enrollment-step-validity: 10m
      password-min-length: 12
      password-max-bytes: 72
      bcrypt-cost: 12
      totp-issuer: "PayCore Admin (Demo)"
      # 키는 base64 256비트를 환경변수로만 주입한다(저장소에 키 없음). LIVE에서 Demo 키·키 없음 기동 거부는 S4(n-4).
      totp-cipher:
        current-key-version: 1
        keys:
          "1": ${PAYCORE_ADMIN_TOTP_CIPHER_KEY_V1}
      login-name-hmac-key: ${PAYCORE_ADMIN_LOGIN_NAME_HMAC_KEY}
      # 세션 한도(D-SV Demo): 익명·등록 진행 idle 10분, 비밀번호 단계(TOTP 대기) 5분, 로그인 idle 15분, 로그인 절대 8시간.
      session:
        anonymous-idle: 10m
        password-step-idle: 5m
        authenticated-idle: 15m
        absolute: 8h
