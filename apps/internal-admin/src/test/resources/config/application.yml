# 시험 전용 설정(test classpath에만 — 운영 jar에 들어가지 않는다). classpath:/config/application.yml은 운영 application.yml 위에 덧씌운다.
# 아래 키는 **시험 전용 값**이다(운영 키 아님 — 운영 키는 비밀 저장소에서 주입, LIVE 가드는 S4). BCrypt cost 4는 시험 속도용이다:
# 운영·Demo 값(12)은 application.yml에 있고, cost가 해시에 반영되는지는 AccountCryptoAdaptersSpec이 adapter를 직접 만들어 확인한다.
# management 포트(D-15): 시험은 임의 포트(실제 서버를 띄우는 RANDOM_PORT 시험만 자식 컨텍스트가 생긴다 — MOCK 시험에는 management 서버가 없다).
management:
  server:
    port: 0

# ACQ-ADMIN-001 rev 0.6(Coordinator 결정 — 시험 설정만, 기대값 불변): Spring Session JDBC 만료 정리 cron을 시험에서 끈다("-" = Spring Session 4.1.1
# JdbcIndexedSessionRepository.afterPropertiesSet가 스케줄러를 만들지 않는 값 — javap 확인). 운영 cron("0 * * * * *")이 매분 다른 스레드에서 TX를 열어
# LoginServiceSpec의 전역 TX 계수(CountingTransactionManager.begins)에 +1로 섞였다. 다른 job들이 시험에서 enabled: false인 것과 같은 취지 —
# 정리 동작 자체는 AnonymousSessionGrowthSpec이 cleanUpExpiredSessions()를 직접 불러 확인한다.
spring:
  session:
    jdbc:
      cleanup-cron: "-"

paycore:
  admin:
    deployment-mode: DEMO
    approval:
      # I-131: 근거·사유 조회 속도 제한(시험 값).
      justification-per-minute: 5
      expiry-job:
        # 시험은 job을 끄고 Use Case(expireDue)를 직접 부른다(경합 시험에 끼어들지 않게).
        enabled: false
    # PAYMENT 운영 호출(시험): 대역 서버 StubPaymentOpsServer(고정 포트 — 새 Spring 컨텍스트를 만들지 않게), 키 = 계약 golden ② 시험 키 adm-golden-k1(공개 값 — 운영 키 아님).
    # 시험 timeout은 짧게(timeout → EXECUTION_UNKNOWN 시험), 순서 검사는 운영과 같다: stale(1s + 2s + 30s) < backoff-max(1m) < window(24h) ≤ PAYMENT 거울(24h).
    payment-ops:
      base-url: http://127.0.0.1:18493
      key-id: adm-golden-k1
      signing-key: "dGVzdC1vbmx5LWFkbWluLWNhbGwtZ29sZGVuLWtleS0wMDAx"
      connect-timeout: 1s
      read-timeout: 2s
      permits:
        approval: 4
        lookup: 4
        execution: 4
      lookup-per-minute: 5
      execution-window: 24h
      backoff-initial: 30s
      backoff-max: 1m
      payment-max-execution-window: 24h
      deadline-skew: 5m
      recovery-batch-size: 50
      # 대사(§4.17 — Demo): PAYMENT 안정 지연 거울 값, 실행당 증분 페이지 상한, 전체 스캔 주기(watermark 불변 — 최종 안전망).
      decision-stable-delay: 2m
      reconciliation-max-pages: 10
      reconciliation-full-scan-interval: 1d
      reconciliation:
        enabled: false
        fixed-delay: 5m
      recovery:
        # 시험은 job을 끄고 Use Case(recoverDue)를 직접 부른다.
        enabled: false
        fixed-delay: 30s
    # MASTER 조회 호출(시험): 대역 StubMasterOpsServer(고정 포트), 키 = 시험 전용 mops-test-k1(공개 값 — 운영 키 아님, payment-ops 시험 키와 다른 바이트·kid).
    master-ops:
      base-url: http://127.0.0.1:18494
      key-id: mops-test-k1
      signing-key: "dGVzdC1vbmx5LW1hc3Rlci1hZG1pbi1jaGFubmVsLWtleS0wMDAx"
      connect-timeout: 1s
      read-timeout: 2s
      permits: 4
      lookup-per-minute: 1000
      registration-number-searches-per-minute: 1000
    # FINANCIAL 매입 현황 조회 호출(시험 — ACQ-VIEW-001): 대역 StubFinancialOpsServer(고정 포트), 키 = 시험 전용 fops-test-k1(financial-batch 시험 키와 같은 공개 값 — 운영 키 아님,
    # payment-ops·master-ops 시험 키와 다른 바이트·kid).
    financial-ops:
      base-url: http://127.0.0.1:18495
      key-id: fops-test-k1
      signing-key: "dGVzdC1vbmx5LWZpbmFuY2lhbC1hZG1pbi1jaGFubmVsLWtleS0wMDAx"
      connect-timeout: 1s
      read-timeout: 2s
      permits: 4
      lookup-per-minute: 1000
      # ACQ-ADMIN-001 B1-A(D-ACQA-001): 조작 전용 시험 키 fops-op-test-k1(financial-batch 시험 조작 키와 같은 공개 값 — 운영 키 아님, 조회 키와 kid·바이트 다름).
      # 실행 기한 폭은 FINANCIAL max-execution-window(PT24H) 이하(Demo 값).
      operation-key-id: fops-op-test-k1
      operation-signing-key: "dGVzdC1vbmx5LWZpbmFuY2lhbC1hZG1pbi1vcGVyYXRpb24ta2V5LTAwMDE="
      operation-permits: 2
      operation-execution-window: 24h
    accounts:
      active-role-gauge:
        # D-ADMIN1-023 활성 역할 gauge job: 시험은 끄고 Use Case(refresh)를 직접 부른다(값 단언에 끼어들지 않게). 켠 배선은 ActiveRoleHolderGaugeSchedulerSpec.
        enabled: false
    network:
      # MockMvc 기본 remoteAddr(127.0.0.1)와 IpAllowlistSpec의 CIDR 시험 값.
      ip-allowlist: 127.0.0.1,10.20.0.0/16
    security:
      bcrypt-cost: 4
      totp-cipher:
        current-key-version: 1
        keys:
          "1": "dGVzdC1vbmx5LXRvdHAtY2lwaGVyLWtleS0zMmJ5dGU="
      login-name-hmac-key: "dGVzdC1vbmx5LWxvZ2luLW5hbWUtaG1hYy1rZXktMzI="
