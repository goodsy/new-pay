spring:
  application:
    name: master-api
  # MASTER DB 접속 정보는 환경변수로만 주입한다. 기본값/비밀번호를 저장소에 두지 않는다. 다른 소유 DB 접속 정보는 두지 않는다.
  datasource:
    # runtime 계정: DB 단위 권한 없이 role(paycore_master_runtime)의 표 단위 권한만(DDL 불가, append-only·insert-only 표는 SELECT·INSERT만).
    # 계정·role·권한 부여 procedure: docker/mysql/init/01-owned-databases.sh, 표별 권한: db/runtime-privilege/master(MASTER-DOMAIN-001, §9.2 관례).
    url: ${PAYCORE_MASTER_DB_URL}
    username: ${PAYCORE_MASTER_DB_USERNAME}
    password: ${PAYCORE_MASTER_DB_PASSWORD}
    hikari:
      # 모든 JDBC 경로(JPA 밖의 jOOQ·raw SQL 포함)에서 DATETIME ↔ Instant를 UTC로 변환하고 세션 time_zone도 UTC로 맞춘다(payment-api와 같은 관례,
      # CP-DB-001 M-2). URL이 아니라 driver 속성으로 둬서 어떤 URL이 주입되든 같이 적용된다(MasterUtcSessionSpec).
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    # 화면/API에는 DTO만 전달한다. 요청 전체에 영속성 컨텍스트를 열어 두지 않는다.
    open-in-view: false
    hibernate:
      # schema 기준은 Flyway migration. Hibernate가 DDL을 만들지 않고 일치 여부만 검사한다.
      ddl-auto: validate
    properties:
      # 시각 컬럼은 UTC로 읽고 쓴다(JVM 기본 시간대와 무관).
      hibernate.jdbc.time_zone: UTC
  flyway:
    # 업무 schema(db/migration/master)와 runtime 표 단위 권한(db/runtime-privilege/master). 권한 migration을 별도 위치에 두는 이유:
    # jOOQ 생성기는 업무 schema 위치만 적용하며 생성기 컨테이너에는 권한 부여 procedure가 없다(ARCHITECTURE-CONVENTIONS §9.2).
    locations: classpath:db/migration/master,classpath:db/runtime-privilege/master
    # migration 계정(MASTER DB ALL, GRANT OPTION 없음). Flyway만 이 계정으로 별도 연결을 만든다(URL은 datasource와 같다).
    user: ${PAYCORE_MASTER_DB_MIGRATION_USERNAME}
    password: ${PAYCORE_MASTER_DB_MIGRATION_PASSWORD}
    # 별도 연결에는 위 hikari driver 속성이 적용되지 않는다. migration 세션도 UTC로 맞춰 시각 기본값/변환이 앱과 같게 한다.
    init-sqls: "SET time_zone = '+00:00'"
  jooq:
    sql-dialect: MYSQL

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    # 민감값 비노출(D-MD-008, review M-2): Hibernate는 JDBC 오류 원문을 로그로 남기는데 MySQL 1062 원문에는 키 값(사업자등록번호·채널 식별값·ID)이
    # 그대로 들어 있다("Duplicate entry '<값>' for key …"). 저장 실패는 adapter가 PersistenceFailure(제약 이름만)로 분류하고 application이
    # 구조화 로그(연산·상관 ID, 값 없음)를 남기므로 원문 로그는 끈다. Hibernate 7 범주(org.hibernate.orm.jdbc.error)와 이전 이름 모두.
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
