# 시험 전용 설정(test classpath에만 있다 — 운영 jar에 들어가지 않는다). Spring Boot는 classpath:/config/application.yml을 운영
# application.yml 위에 덧씌운다. 운영 application.yml에는 아래 값의 기본값이 없다(없으면 기동 실패 — MASTER-SNAPSHOT-001 명세 §8).
#
# 아래 수치는 **시험 fixture**다(운영값 아님, 허용 §4.2 마지막 문단: 전파 지연·lease·시계 오차·갱신 주기·ACK timeout 운영 수치는 미확정).
# 서명 키는 시험 전용 값이다(운영 키 아님 — D-MS-004: 운영 키는 비밀 저장소에서 주입, mTLS는 LIVE 허용 전 별도).
paycore:
  master:
    entitlement:
      lease-duration: PT2S
      renew-before: PT1S
      # 시험은 주기 실행을 끄고 use case를 직접 부른다. 주기 값은 placeholder 해석(기동 실패 방지)용 시험 값.
      scheduling-enabled: false
      renew-scan-interval: PT10S
      relay:
        poll-interval: PT0.5S
        batch-size: 10
        claim-lease: PT1S
        backoff-initial: PT0.01S
        backoff-max: PT0.01S
        backoff-jitter-ratio: 0.0
      dispatch:
        # MasterDbTest는 시험용 가짜 PAYMENT Inbox(FakePaymentInbox, 임의 포트)로 덮어쓴다.
        endpoint: http://127.0.0.1:9/internal/v1/entitlement-snapshots
        connect-timeout: PT0.2S
        read-timeout: PT0.5S
        signing-key-id: test-k1
        signing-key: dGVzdC1vbmx5LWVudGl0bGVtZW50LXNpZ25pbmcta2V5LTEh
    # ADMIN → MASTER 서명 채널(MERCHANT-OPS-001 §3) — 시험 전용 키(운영 키 아님, 권리 dispatch 키와 다른 kid·바이트). 창·permit은 Demo 값(운영값 LIVE Gate).
    admin-channel:
      clock-window: PT300S
      read-permits: 4
      # MERCHANT-OPS-002 §3.1 C-1: 명령 permit(조회와 별개, 대기 0) — Demo 값 2(운영값 LIVE Gate).
      write-permits: 2
      # TXN-LIST-ENRICH-001 §3.6(M-1): 라벨 조회 전용 permit(조회·명령 permit과 별개, 대기 0) — Demo 값 2(운영값 LIVE Gate).
      label-permits: 2
      # MERCHANT-OPS-002 §9.3 B2-2(C-19): 승인 근거 실행 창·시계 앞섬 — Demo 값(운영값 아님, LIVE Gate). 기본값 없음(없으면 웹 프로세스 기동 실패).
      approval:
        max-execution-window: PT24H
        max-clock-skew: PT1M
      signing-keys:
        - key-id: mops-test-k1
          secret: dGVzdC1vbmx5LW1hc3Rlci1hZG1pbi1jaGFubmVsLWtleS0wMDAx
