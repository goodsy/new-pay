# PayCore version catalog.
# Boot 관리 항목은 Spring Boot BOM(platform)이 버전을 결정한다. 여기서는 BOM 밖 항목과 plugin만 고정한다.
# 근거와 확인 일자: docs/repository/TECH-BASELINE.md
[versions]
spring-boot = "4.1.1"
# Boot 4.1.1 BOM의 kotlin.version과 동일하게 유지한다.
kotlin = "2.3.21"
spring-modulith = "2.1.1"
kotest = "6.2.5"
mockk = "1.14.11"
springmockk = "5.0.1"
archunit = "1.5.1"
# 테스트 전용 자동 Fixture 도구(Test Fixture Policy). Boot BOM 밖이라 여기서 고정한다. production runtime 유입 금지(verifyTestOnlyDependencies).
# 1.2.3: 2026-10-07 Maven Central 최신 GA. Kotlin 모듈은 kotlin-reflect/stdlib를 요구하며 버전은 Boot BOM(2.3.21)이 정한다.
fixture-monkey = "1.2.3"
# SBOM(CycloneDX). 공급망 증거(docs/baseline/architecture/09). 취약점 검사는 osv-scanner(저장소 밖 도구)로 SBOM을 읽는다.
cyclonedx = "3.4.1"
# 보안 patch override(Boot 4.1.1 BOM: tomcat 11.0.24, jackson 3.1.5). 근거: docs/repository/TECH-BASELINE.md §1.1
security-patch-tomcat = "11.0.26"
security-patch-jackson = "3.1.7"
# 프론트 빌드 도구(ADMIN-BOOT-001, Boot BOM 밖·빌드 전용 — runtime/SBOM에 들어가지 않는다). 근거: docs/repository/TECH-BASELINE.md §9
# node-gradle 7.1.0: 2024-09-27 최신 GA(Gradle 9.8.0 동작 실측). Node는 24.x LTS(Krypton) 보안 patch 예외 24.22.1(2026-10-20 —
# 14일 규칙 예외, Coordinator Q-S0-1 판정 B. 제거 조건: 게시 14일 경과(2026-11-03) 뒤 재평가). SHA-256은 nodejs.org SHASUMS256.txt(GPG 서명 검증)의
# node-v24.22.1-linux-x64.tar.gz 값이며 paycore.frontend의 frontendNodeVerify가 해석된 압축과 대조한다(F-9).
node-gradle = "7.1.0"
node = "24.22.1"
node-sha256-linux-x64 = "eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }

spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# Boot 4: starter-batch는 in-memory JobRepository. 재시작에는 JDBC JobRepository(batch-jdbc)가 필요하다.
spring-boot-starter-batch-jdbc = { module = "org.springframework.boot:spring-boot-starter-batch-jdbc" }
spring-boot-starter-batch-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-batch-jdbc-test" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-modulith-api = { module = "org.springframework.modulith:spring-modulith-api" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
# WEBHOOK-001 가맹점 Webhook 전송(D-WH-007 — 해석 주소 고정 DnsResolver·redirect 금지). Boot 4.1.1 BOM 관리 버전(httpclient5 5.6.4) — 여기서 버전을 고정하지 않는다.
apache-httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
# jOOQ codegen(빌드 도구 전용 source set). 버전은 Boot BOM의 jooq.version을 따른다.
jooq-codegen = { module = "org.jooq:jooq-codegen" }
jooq-meta = { module = "org.jooq:jooq-meta" }
slf4j-simple = { module = "org.slf4j:slf4j-simple" }
# internal-admin 관리자 세션 저장소(Spring Session JDBC — D-ADMIN-004, ADMIN-BOOT-001 S4). Boot 4.1.1 BOM 관리(spring-session 4.1.1). S2의 시험 전용
# spring-session-jdbc 항목을 운영 starter로 바꿨다(F-1 fixture도 이 의존성으로 컴파일된다).
spring-boot-starter-session-jdbc = { module = "org.springframework.boot:spring-boot-starter-session-jdbc" }

# libs/test-support 전용(버전은 Boot BOM). spring-boot-test는 MySqlTestContainerConfig 컴파일용(compileOnly),
# 나머지는 아키텍처 규칙 meta-test fixture 컴파일용(testImplementation)이며 앱 runtime에 들어가지 않는다.
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }
spring-context = { module = "org.springframework:spring-context" }
spring-web = { module = "org.springframework:spring-web" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
jooq = { module = "org.jooq:jooq" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons" }
spring-batch-core = { module = "org.springframework.batch:spring-batch-core" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
jakarta-transaction-api = { module = "jakarta.transaction:jakarta.transaction-api" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
slf4j-api = { module = "org.slf4j:slf4j-api" }

kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
fixture-monkey-kotlin = { module = "com.navercorp.fixturemonkey:fixture-monkey-kotlin", version.ref = "fixture-monkey" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
