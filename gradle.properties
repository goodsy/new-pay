# Gradle daemon heap 상한 -Xmx2g(in-process Kotlin 컴파일). TEST-PERF-001(측정 근거: docs/repository/TECH-BASELINE.md §7.3): 컴파일이 끝난 뒤
# 시험 단계에서 daemon이 쓰지 않는 heap을 OS에 돌려주도록 G1 주기 GC(30초 idle)와 여유 비율 상한을 둔다(상한 -Xmx는 그대로).
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:G1PeriodicGCInterval=30000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -Dfile.encoding=UTF-8
org.gradle.caching=true
# 모듈 병렬 실행(TEST-PERF-001). 스케줄만 바뀐다 — 실행되는 task·시험·판정 기준(--no-build-cache --rerun-tasks)은 같다. 메모리를 많이 쓰는
# test JVM과 in-process Kotlin 컴파일은 build-logic paycore.kotlin-base의 ExclusiveSlots로 각각 한 번에 하나만 돈다.
# 이 파일의 값들은 메모리 작은 호스트·CI용 저장소 기본값이다. 메모리 큰 호스트의 상향(paycore.dbTestJvmSlots 등·workers·daemon heap)은
# 저장소 밖 ~/.gradle/gradle.properties로만 한다 — docs/repository/TECH-BASELINE.md §7.3 "호스트별 병렬도 속성"(BUILD-PERF-MAC-001).
# 여기 org.gradle.jvmargs를 바꾸면 그 문서 표와 각 호스트의 ~/.gradle/gradle.properties도 함께 갱신한다(사용자 값이 통째로 대체).
org.gradle.parallel=true
org.gradle.workers.max=4
# JDK는 로컬 설치본(Java 25)만 사용한다. toolchain 자동 다운로드 금지.
org.gradle.java.installations.auto-download=false
kotlin.code.style=official
# 빌드 메모리 상한(MASTER-BOOT-001, 측정 근거: docs/repository/TECH-BASELINE.md §7).
# Kotlin 컴파일을 별도 Kotlin daemon(-Xmx2g, 빌드 후 2시간 idle 유지) 대신 Gradle daemon 안에서 한다. 이전에는 build-logic(2.4.x)과
# 앱(2.3.21)용 daemon 두 개가 각각 약 1.0~1.2GB를 쓰고 --no-daemon 빌드가 끝난 뒤에도 남았다. 판정 기준(--no-build-cache --rerun-tasks,
# 전 test 실행)과 컴파일 결과(경고=오류)는 바뀌지 않는다. build-logic(included build)은 build-logic/gradle.properties에 같은 값을 둔다.
kotlin.compiler.execution.strategy=in-process
